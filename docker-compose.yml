services:
  mysql:
    image: mysql:8.0
    container_name: pms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-project_management}
      MYSQL_USER: ${DB_USER:-pms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pms_password}
    ports:
      - '${DB_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${DB_ROOT_PASSWORD:-rootpassword}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build: ./server
    container_name: pms-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-pms_user}
      DB_PASSWORD: ${DB_PASSWORD:-pms_password}
      DB_NAME: ${DB_NAME:-project_management}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '4000:4000'

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api
    container_name: pms-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '8080:80'

volumes:
  mysql_data:
